[package]
name = "{{project-name}}-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "{{project-name}}-server"
path = "src/main.rs"

[dependencies]
{{project-name}}-frontend = { path = "../frontend", features = ["ssr"] }
axum-egui = { version = "0.2", features = ["server"] }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
axum-egui-build = "0.2"
{{project-name}}-frontend = { path = "../frontend", artifact = "cdylib", target = "wasm32-unknown-unknown", features = ["hydrate"] }
