[package]
name = "{{project-name}}-frontend"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["axum-egui/server", "dep:axum"]
hydrate = [
    "axum-egui/client",
    "dep:eframe",
    "dep:egui",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:log",
    "dep:futures-util",
]

[dependencies]
axum-egui = { version = "0.2", default-features = false }
axum = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

eframe = { version = "0.31", default-features = false, features = ["wgpu", "web_screen_reader"], optional = true }
egui = { version = "0.31", optional = true }

wasm-bindgen = { version = "=0.2.104", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlCanvasElement"], optional = true }
log = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
